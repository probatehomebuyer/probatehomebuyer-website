name: Weekly SEO opportunity report

on:
  schedule:
    # GitHub cron is UTC. 07:30 UTC is 08:30 during British Summer Time
    # and 07:30 during Greenwich Mean Time. See docs/weekly-seo-system.md.
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-seo-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      SEO_COMPETITOR_URLS: ${{ vars.SEO_COMPETITOR_URLS }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/seo/requirements.txt

      - name: Install Search Console dependencies
        run: python -m pip install -r scripts/seo/requirements.txt

      - name: Inventory and audit existing content
        run: python scripts/seo/site_audit.py --root . --output-dir seo-output

      - name: Retrieve final Search Console data and create report
        run: python scripts/seo/gsc_weekly_report.py --inventory seo-output/content-inventory.json --output-dir seo-output

      - name: Run optional bounded competitor research
        run: python scripts/seo/competitor_research.py --inventory seo-output/content-inventory.json --output seo-output/competitor-research.md

      - name: Combine report sections
        run: python scripts/seo/combine_reports.py

      - name: Add primary report to workflow summary
        if: success()
        run: cat seo-output/weekly-seo-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw data and reports privately as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-report-${{ github.run_id }}
          path: seo-output/
          if-no-files-found: error
          retention-days: 35

      - name: Create or update the rolling weekly SEO issue
        if: success()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: seo-output/combined-weekly-report.md
        with:
          script: |
            const fs = require('fs');
            const title = 'Weekly SEO opportunity report';
            const marker = '<!-- automated-weekly-seo-report -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report}\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-report',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'seo-report',
                  color: '0b3b60',
                  description: 'Automated weekly SEO reporting'
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['seo-report']
              });
            }
